name: Promote youareinthegame.com

# Isolated promote for joshdwall/youareinthegame ONLY.
# Deploys this repo's static site to the Cloudflare Pages project `youareinthegame` and nothing else
# (no enVivo / site-hub / personal-website checkouts, no other Pages projects, no DNS or Worker changes).
# Preview first: default target is the `preview` branch → https://preview.youareinthegame.pages.dev
# Production: (a) auto_production=true → preview → automated verify (scripts/verify-site.sh) → production → verify, no human wait
#   (not approved for this repo), or (b) preview_branch=production + confirm_production=promote-production.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'true = build + checks only, no deploy'
        required: false
        default: 'true'
        type: string
      preview_branch:
        description: 'Pages preview branch (default preview). Type production (or leave empty) for PRODUCTION (needs confirm_production).'
        required: false
        default: 'preview'
        type: string
      auto_production:
        description: 'true = after the preview passes automated verify, promote the same build to PRODUCTION and verify it'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']
      confirm_production:
        description: 'PRODUCTION gate — type promote-production (operator go only)'
        required: false
        default: ''
        type: string

concurrency:
  group: promote-youareinthegame
  cancel-in-progress: false

env:
  PAGES_PROJECT: youareinthegame

jobs:
  promote:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Production gate (operator go)
        if: ${{ inputs.dry_run == 'false' && (inputs.preview_branch == '' || inputs.preview_branch == 'production') && inputs.confirm_production != 'promote-production' }}
        run: |
          echo "::error::Production deploy needs confirm_production=promote-production (operator go)"; exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build bundle + unit checks
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
          node scripts/build.mjs
          npm test
          test -f dist/index.html && test -f dist/runtime/shared/session-roll.js

      - name: Cloudflare credentials from Infisical (/cloudflare)
        if: ${{ inputs.dry_run == 'false' }}
        env:
          INFISICAL_CLIENT_ID: ${{ secrets.INFISICAL_CLIENT_ID }}
          INFISICAL_CLIENT_SECRET: ${{ secrets.INFISICAL_CLIENT_SECRET }}
        run: bash scripts/infisical-gha-env.sh /cloudflare agents-write=CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID=CLOUDFLARE_ACCOUNT_ID

      - name: Count deploy (politics counter, D3; 429 stops the run)
        if: ${{ inputs.dry_run == 'false' }}
        env:
          INFISICAL_CLIENT_ID: ${{ secrets.INFISICAL_CLIENT_ID }}
          INFISICAL_CLIENT_SECRET: ${{ secrets.INFISICAL_CLIENT_SECRET }}
        run: |
          bash scripts/infisical-gha-env.sh /sites/politics site.politics.import_token=POLITICS_IMPORT_TOKEN
          body() { jq -nc --arg op "$1" --arg d "${{ inputs.preview_branch || 'production' }} youareinthegame $GITHUB_SHA" '{operation:$op,caller:"cf-native-deploy",detail:$d}'; }
          post() { curl -s -o /tmp/c.json -w '%{http_code}' -X POST https://joshdwall.com/politics/api/events -H "authorization: Bearer $POLITICS_IMPORT_TOKEN" -H 'content-type: application/json' -H 'x-politics-caller: cf-native-deploy' -d "$(body $1)"; }
          c=$(post worker-deploy); [ "$c" = 400 ] && c=$(post pages-build)
          [ "$c" != 429 ] || { echo "::error::politics counter at block line"; exit 1; }
          [ "${c:0:1}" = 2 ] || { echo "::error::counter HTTP $c"; exit 1; }

      - name: Deploy PREVIEW
        if: ${{ inputs.dry_run == 'false' && (inputs.preview_branch != '' && inputs.preview_branch != 'production') }}
        env:
          BR: ${{ inputs.preview_branch }}
        run: |
          [ "$BR" != "main" ] || { echo "::error::main is the production branch; leave preview_branch empty + confirm for production"; exit 1; }
          npx --yes wrangler@4 pages deploy dist --project-name "$PAGES_PROJECT" --branch "$BR" --commit-hash "$GITHUB_SHA" --commit-message "preview $GITHUB_SHA" --commit-dirty=true
          echo "Preview: https://$BR.$PAGES_PROJECT.pages.dev" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify PREVIEW (automated gate)
        if: ${{ inputs.dry_run == 'false' && (inputs.preview_branch != '' && inputs.preview_branch != 'production') }}
        env:
          BR: ${{ inputs.preview_branch }}
        run: bash scripts/verify-site.sh "https://$BR.$PAGES_PROJECT.pages.dev"

      - name: Deploy PRODUCTION (auto, after preview verify passed)
        if: ${{ inputs.dry_run == 'false' && inputs.auto_production == 'true' && inputs.preview_branch != '' && inputs.preview_branch != 'production' }}
        run: |
          npx --yes wrangler@4 pages deploy dist --project-name "$PAGES_PROJECT" --branch main --commit-hash "$GITHUB_SHA" --commit-message "production $GITHUB_SHA (auto after preview verify)" --commit-dirty=true
          echo "Production (auto): https://youareinthegame.com" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify PRODUCTION (auto path)
        if: ${{ inputs.dry_run == 'false' && inputs.auto_production == 'true' && inputs.preview_branch != '' && inputs.preview_branch != 'production' }}
        run: |
          bash scripts/verify-site.sh "https://$PAGES_PROJECT.pages.dev"
          bash scripts/verify-site.sh "https://youareinthegame.com"
          bash scripts/verify-site.sh "https://www.youareinthegame.com"

      - name: Deploy PRODUCTION (operator go)
        if: ${{ inputs.dry_run == 'false' && (inputs.preview_branch == '' || inputs.preview_branch == 'production') && inputs.confirm_production == 'promote-production' }}
        run: |
          npx --yes wrangler@4 pages deploy dist --project-name "$PAGES_PROJECT" --branch main --commit-hash "$GITHUB_SHA" --commit-message "production $GITHUB_SHA" --commit-dirty=true
          echo "Production: https://$PAGES_PROJECT.pages.dev (custom domain binding is a separate step)" >> "$GITHUB_STEP_SUMMARY"

      - name: Smoke check
        if: ${{ inputs.dry_run == 'false' }}
        env:
          BR: ${{ inputs.preview_branch }}
        run: |
          [ "$BR" = "production" ] && BR=""
          host=$([ -n "$BR" ] && echo "$BR.$PAGES_PROJECT.pages.dev" || echo "$PAGES_PROJECT.pages.dev")
          for i in 1 2 3 4 5 6; do curl -fsS "https://$host/" | grep -q 'id="mainCreature"' && break; sleep 10; done
          curl -fsS "https://$host/content/characters-registry.json" -o /dev/null
          echo "smoke ok https://$host/"
          bash scripts/verify-site.sh "https://$host"
