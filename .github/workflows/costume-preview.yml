name: Costume preview
on:
  push:
    branches: ['costume/**']
    paths-ignore: ['scripts/cloudflare-history.mjs', '.github/workflows/worldmap-history-audit.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: youareinthegame-costume-preview
  cancel-in-progress: false
jobs:
  preview:
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run verify
      - run: npm run test:costumes
      - run: npm run test:worldmap
      - name: Build, back up baseline, isolate and deploy preview
        id: preview
        env:
          INFISICAL_CLIENT_ID: ${{ secrets.INFISICAL_CLIENT_ID }}
          INFISICAL_CLIENT_SECRET: ${{ secrets.INFISICAL_CLIENT_SECRET }}
        run: node scripts/costume-preview.mjs
      - name: Install browser
        if: steps.preview.outputs.url != ''
        run: npx playwright install --with-deps chromium
      - name: Browser verification
        if: steps.preview.outputs.url != ''
        env:
          INFISICAL_CLIENT_ID: ${{ secrets.INFISICAL_CLIENT_ID }}
          INFISICAL_CLIENT_SECRET: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          COSTUME_PREVIEW_URL: ${{ steps.preview.outputs.url }}
        run: node scripts/costume-preview.mjs --browser-only
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: costume-preview-evidence
          path: .preview-evidence/
          include-hidden-files: true
          retention-days: 30
