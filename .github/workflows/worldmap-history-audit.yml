name: Discover Cloudflare history
on:
  push:
    branches: ['costume/visitor-worldmap']
    paths: ['scripts/cloudflare-history.mjs', '.github/workflows/worldmap-history-audit.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read analytics availability and schema
        env:
          INFISICAL_CLIENT_ID: ${{ secrets.INFISICAL_CLIENT_ID }}
          INFISICAL_CLIENT_SECRET: ${{ secrets.INFISICAL_CLIENT_SECRET }}
        run: node scripts/costume-preview.mjs --history-audit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cloudflare-history-audit
          path: .preview-evidence/
          include-hidden-files: true
          retention-days: 30
