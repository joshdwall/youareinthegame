# Cloudflare Pages project: youareinthegame-web (git-connected; Cloudflare builds main = PRODUCTION; previews off).
# Deploy = merge to main. No GitHub Actions. Rollback = Pages "Rollback" to a prior deployment.
name = "youareinthegame-web"
pages_build_output_dir = "dist"
compatibility_date = "2024-09-23"

[vars]
YAITG_RATE_MAX = "12"
YAITG_RATE_WINDOW_SEC = "3600"
CONTACT_TO = "joshdwall@gmail.com"
CONTACT_FROM = "hello@youareinthegame.com"

[[send_email]]
name = "SEND_EMAIL"
destination_address = "joshdwall@gmail.com"

[[send_email]]
name = "SEND_VISITOR"

# YAITG_SESSION_SECRET is a Pages secret (Infisical /sites/youareinthegame), never in git.
[[kv_namespaces]]
binding = "YAITG_SESSION_KV"
id = "384434fdf4f241be872e33e6c5fcbff3"

[[r2_buckets]]
binding = "YAITG_ASSETS_R2"
bucket_name = "youareinthegame-assets"

# Independent production visitor database; previews override this binding.
[[d1_databases]]
binding = "YAITG_WORLDMAP_DB"
database_name = "youareinthegame-worldmap"
database_id = "dc3f9e8b-5b98-406d-a0d7-a0d7c355b24e"
