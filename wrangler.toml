# Cloudflare Pages project: youareinthegame-web (git-connected; Cloudflare builds main = PRODUCTION; previews off).
# Deploy = merge to main. No GitHub Actions. Rollback = Pages "Rollback" to a prior deployment.
name = "youareinthegame-web"
pages_build_output_dir = "dist"
compatibility_date = "2024-09-23"

[vars]
YAITG_RATE_MAX = "12"
YAITG_RATE_WINDOW_SEC = "3600"

# YAITG_SESSION_SECRET is a Pages secret (Infisical /sites/youareinthegame), never in git.
[[kv_namespaces]]
binding = "YAITG_SESSION_KV"
id = "384434fdf4f241be872e33e6c5fcbff3"

[[r2_buckets]]
binding = "YAITG_ASSETS_R2"
bucket_name = "youareinthegame-assets"
