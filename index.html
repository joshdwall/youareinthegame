<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Mushroom Platypus - Tap for Spores</title>
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" href="/favicon.png" sizes="48x48">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css?v=interaction-shadow-1">
</head>

<body>
  <div class="container">
    <img src="img/mushroom-platypus.webp" alt="Mushroom Platypus Creature" class="creature" id="mainCreature"
      draggable="false"
      onerror="this.onerror=null;this.src='img/mushroom-platypus.png'">
    <button type="button" id="tapSporeBadge" class="spore-sticker-picture">
      <img src="img/tap-for-spores.png" alt="Tap for spores" class="spore-sticker" draggable="false"
        width="192" height="192">
    </button>
  </div>
  <!-- Instant interactivity: attach listeners at first paint (before module graph). -->
  <script>
    (function () {
      var SPORE = '/effects/spore/mushroom-platypus-spores.png';
      var takenOver = false;
      var pending = 0;
      var creature, container;
      function clampBurst(x, y, angle, velocity) {
        var vw = window.innerWidth || 390, vh = window.innerHeight || 844;
        var minDim = Math.min(vw, vh);
        var scale = Math.min(1, Math.max(0.45, minDim / 720));
        var tx = Math.cos(angle) * velocity * scale;
        var ty = Math.sin(angle) * velocity * scale;
        var sw = 76, sh = 50, m = 8;
        var endX = Math.min(vw - m - sw / 2, Math.max(m + sw / 2, x + tx));
        var endY = Math.min(vh - m - sh / 2, Math.max(m + sh / 2, y + ty));
        return { tx: endX - x, ty: endY - y };
      }
      function burst(x, y) {
        if (!container) return;
        var layers = 2, count = 16, per = count / layers;
        for (var layer = 0; layer < layers; layer++) {
          var radius = (layer + 1) * 60;
          for (var i = 0; i < per; i++) {
            var spore = document.createElement('img');
            spore.src = SPORE;
            spore.className = 'spore';
            spore.draggable = false;
            spore.setAttribute('draggable', 'false');
            var angle = (Math.PI * 2 * i) / per + (Math.random() - 0.5) * 0.3;
            var velocity = radius + Math.random() * 50;
            var d = clampBurst(x, y, angle, velocity);
            spore.style.setProperty('--tx', d.tx + 'px');
            spore.style.setProperty('--ty', d.ty + 'px');
            spore.style.setProperty('--rotation', (360 + Math.random() * 720) + 'deg');
            spore.style.left = (x - 38) + 'px';
            spore.style.top = (y - 25) + 'px';
            var delay = layer * 0.08 + i * 0.02;
            var dur = 0.6 + Math.random() * 0.4;
            spore.style.animation = 'explode ' + dur + 's ease-out ' + delay + 's forwards';
            container.appendChild(spore);
            (function (el, ms) { setTimeout(function () { el.remove(); }, ms); })(spore, (dur + delay) * 1000);
          }
        }
      }
      function onCreature(e, fromBadge) {
        if (takenOver) return;
        pending++;
        var rect = container.getBoundingClientRect();
        if (fromBadge) {
          var center = creature.getBoundingClientRect();
          burst(center.left + center.width / 2 - rect.left, center.top + center.height / 2 - rect.top);
        } else {
          burst(e.clientX - rect.left, e.clientY - rect.top);
        }
      }
      function onContainer(e) {
        if (takenOver) return;
        if (e.target === creature) return;
        var badge = e.target.closest && e.target.closest('#tapSporeBadge');
        if (badge) {
          if (!badge.disabled) onCreature(e, true);
          return;
        }
        var rect = container.getBoundingClientRect();
        burst(e.clientX - rect.left, e.clientY - rect.top);
      }
      function hardenImg(el) {
        if (!el || el.nodeType !== 1) return;
        if (el.tagName === 'IMG') {
          el.draggable = false;
          el.setAttribute('draggable', 'false');
        }
        if (el.querySelectorAll) {
          el.querySelectorAll('img').forEach(function (img) {
            img.draggable = false;
            img.setAttribute('draggable', 'false');
          });
        }
      }
      function onContextMenu(e) {
        var t = e.target;
        if (!t) return;
        if (t.closest && t.closest('input, textarea, select, [contenteditable="true"]')) return;
        if (t.closest && t.closest('.container, .creature-rig, #mainCreature, .spore-sticker-picture, img, picture, .public-overlay, .activation-spore, .spore')) {
          e.preventDefault();
        }
      }
      function onFirstTouchClick(e) {
        var isTouch = e.pointerType === 'touch' ||
          (!e.pointerType && e.detail > 0 && window.matchMedia('(hover: none) and (pointer: coarse)').matches);
        if (!isTouch || !e.target.closest('#mainCreature, #tapSporeBadge:not(:disabled)')) return;
        creature.classList.add('has-touch-shadow');
        document.removeEventListener('click', onFirstTouchClick, true);
      }
      function attach() {
        creature = document.getElementById('mainCreature');
        container = document.querySelector('.container');
        if (!creature || !container) return;
        hardenImg(creature);
        hardenImg(container);
        document.addEventListener('click', onFirstTouchClick, true);
        creature.addEventListener('click', onCreature);
        container.addEventListener('click', onContainer);
        document.addEventListener('contextmenu', onContextMenu, true);
        try {
          var mo = new MutationObserver(function (muts) {
            for (var i = 0; i < muts.length; i++) {
              var nodes = muts[i].addedNodes || [];
              for (var j = 0; j < nodes.length; j++) hardenImg(nodes[j]);
            }
          });
          mo.observe(container, { childList: true, subtree: true });
        } catch (_) {}
        try { performance.mark('yaitg-listeners-ready'); } catch (_) {}
        window.__yaitgListenersReadyAt = Date.now();
        window.__yaitgListenersReady = true;
      }
      window.__yaitgEarly = {
        takeOver: function () {
          if (takenOver) return pending;
          takenOver = true;
          if (creature) creature.removeEventListener('click', onCreature);
          if (container) container.removeEventListener('click', onContainer);
          return pending;
        },
        pendingClicks: function () { return pending; }
      };
      if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', attach);
      else attach();
    })();
  </script>
  <a class="worldmap-link" id="visitorsLink" aria-label="Visitors" href="/worldmap/">
    <img src="/img/visitors-earth-labeled.webp" alt="" width="54" height="39" draggable="false">
  </a>
  <script>
    (function () {
      try {
        if ((location.hostname || '').indexOf('app.') === 0) return;
        var url = '/api/worldmap?visit=1';
        if (navigator.sendBeacon) navigator.sendBeacon(url);
        else fetch(url, { method: 'POST', credentials: 'same-origin', keepalive: true });
      } catch (_) { /* visitor counting is optional */ }
    })();
  </script>
  <script type="module" src="script.js?v=interaction-shadow-1"></script>
  <!-- Cloudflare Web Analytics is auto-installed at the zone edge (first-party POST /cdn-cgi/rum). Do not add a manual beacon.min.js snippet; it reports to cloudflareinsights.com and 404s with a CORS console error. -->
</body>

</html>
